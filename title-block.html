<header id="title-block-header">
$if(title)$<h1 class="title">$title$</h1>$endif$
$if(subtitle)$
<p class="subtitle">$subtitle$</p>
$endif$
$for(author)$
<p class="author">$author$</p>
$endfor$

<div class="art-meta-compact">
$if(date)$<span class="art-meta-item art-meta-date">$date$</span>$endif$
$if(license-type)$<span class="art-meta-item"><a href="https://github.com/$repo$/blob/main/LICENSE.md">$license-type$</a></span>$endif$
$if(repo)$<span class="art-meta-item"><a href="https://github.com/$repo$">$repo$</a></span>$endif$
</div>

</header>
